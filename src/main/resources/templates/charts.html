<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Топ-чарт — MIXXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap-sm">
    <div class="flex items-center justify-between mb-8 flex-wrap gap-4">
        <div>
            <h1 class="page-heading" style="margin-bottom:0.25rem;">
                Топ-чарт <span style="color:var(--accent);">MIXXED</span>
            </h1>
            <p style="color:var(--text-muted); margin-top:0;">Самые популярные миксы платформы</p>
        </div>

        <form action="/charts" method="get" class="flex items-center gap-3">
            <select name="genre" onchange="this.form.submit()" class="form-input" style="width:auto;">
                <option value="" th:selected="${selectedGenre == null or selectedGenre.isEmpty()}">Все жанры</option>
                <option th:each="g : ${genres}" th:value="${g.fullName}" th:text="${g.fullName}"
                        th:selected="${g.fullName == selectedGenre}"></option>
            </select>
            <a th:if="${selectedGenre != null and !selectedGenre.isEmpty()}" href="/charts"
               class="back-link">× Сбросить</a>
        </form>
    </div>

    <div class="card overflow-hidden">
        <div th:if="${mixes.isEmpty()}" class="empty-state">Нет миксов в этом жанре.</div>

        <div th:each="mix, stat : ${mixes}" class="chart-row">

            <div class="flex-shrink-0 text-center" style="width:36px;">
                <span th:if="${stat.index < 3}"
                      th:text="${stat.index == 0 ? '🥇' : stat.index == 1 ? '🥈' : '🥉'}"
                      style="font-size:1.25rem;"></span>
                <span th:unless="${stat.index < 3}"
                      th:text="${stat.count}"
                      style="color:var(--text-muted); font-size:0.9375rem; font-weight:700;"></span>
            </div>

            <div class="flex-shrink-0 rounded-lg overflow-hidden" style="width:52px; height:52px; background:var(--border-2);">
                <img th:if="${mix.coverUrl != null}" th:src="'/s3/' + ${mix.coverUrl}"
                     alt="cover" class="w-full h-full object-cover"/>
                <div th:unless="${mix.coverUrl != null}"
                     class="w-full h-full flex items-center justify-center text-2xl">🎵</div>
            </div>

            <div class="flex-1 min-w-0">
                <a th:href="'/mix/' + ${mix.slug}"
                   th:text="${mix.title}"
                   class="font-semibold no-underline block truncate"
                   style="color:var(--text);"></a>
                <a th:href="'/u/' + ${mix.author.username}"
                   th:text="${mix.author.username}"
                   class="no-underline"
                   style="color:var(--text-muted); font-size:0.875rem;"></a>
            </div>

            <div class="flex-shrink-0">
                <span th:if="${mix.genre != null}" class="genre-badge" th:text="${mix.genre}"></span>
            </div>

            <div class="flex-shrink-0 text-right" style="color:var(--text-muted); font-size:0.875rem; min-width:50px;"
                 th:if="${mix.durationSeconds != null}"
                 th:text="${mix.durationSeconds / 60} + ':' + ${#strings.toString(mix.durationSeconds % 60).length() == 1 ? '0' + mix.durationSeconds % 60 : mix.durationSeconds % 60}">
            </div>

            <div class="flex-shrink-0 text-right font-semibold" style="color:var(--text); font-size:0.875rem; min-width:80px;"
                 th:text="${mix.totalPlays} + ' ♪'"></div>

            <a th:href="'/mix/' + ${mix.slug}"
               class="flex-shrink-0 flex items-center justify-center rounded-full no-underline"
               style="width:34px; height:34px; background:var(--accent); color:#0a0a0a; font-size:0.8125rem; font-weight:700;">▶</a>
        </div>
    </div>
</main>
</body>
</html>
