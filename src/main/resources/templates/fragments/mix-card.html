<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="mixCard(mix, showAuthor)" class="mix-card">
    <a th:href="'/mix/' + ${mix.slug}" class="block no-underline">
        <div class="aspect-square overflow-hidden" style="background:var(--border-2);">
            <img th:if="${mix.coverUrl != null}"
                 th:src="@{/s3/{key}(key=${mix.coverUrl})}"
                 alt="cover"
                 class="w-full h-full object-cover"/>
            <div th:unless="${mix.coverUrl != null}"
                 class="w-full h-full flex items-center justify-center text-4xl">🎵</div>
        </div>

        <div class="p-3.5">
            <div th:text="${mix.title}"
                 class="font-semibold truncate mb-1"
                 style="color:var(--text); font-size:0.9375rem;"></div>

            <div th:if="${showAuthor}"
                 th:text="${mix.author.username}"
                 style="color:var(--text-muted); font-size:0.8125rem;"></div>

            <div class="flex justify-between items-center mt-2">
                <span th:if="${mix.genre != null}" class="genre-badge" th:text="${mix.genre}"></span>
                <span style="color:var(--text-muted); font-size:0.75rem;"
                      th:text="${mix.totalPlays} + ' ♪'"></span>
            </div>
        </div>
    </a>
</div>

</html>
