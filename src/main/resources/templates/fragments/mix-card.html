<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="mixCard(mix, showAuthor)" class="mix-card">
    <a th:href="'/mix/' + ${mix.slug}" style="text-decoration:none; display:block;">
        <div style="aspect-ratio:1; background:#2a2a2a; overflow:hidden;">
            <img th:if="${mix.coverUrl != null}"
                 th:src="@{/s3/{key}(key=${mix.coverUrl})}"
                 alt="cover"
                 style="width:100%; height:100%; object-fit:cover;"/>
            <div th:unless="${mix.coverUrl != null}"
                 style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:2.5rem;">
                🎵
            </div>
        </div>

        <div style="padding:0.875rem;">
            <div th:text="${mix.title}"
                 style="font-weight:600; margin-bottom:0.25rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; font-size:0.9375rem;">
            </div>

            <div th:if="${showAuthor}"
                 style="color:#888; font-size:0.8125rem;"
                 th:text="${mix.author.username}">
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.5rem;">
                <span th:if="${mix.genre != null}" class="genre-badge" th:text="${mix.genre}"></span>
                <span style="color:#888; font-size:0.75rem;"
                      th:text="${mix.totalPlays} + ' ♪'">
                </span>
            </div>
        </div>
    </a>
</div>

</html>
