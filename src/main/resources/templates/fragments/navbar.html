<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar(currentUser)" class="navbar">
    <div style="max-width:1280px; margin:0 auto; padding:0 1.5rem; height:64px; display:flex; align-items:center; gap:1.5rem;">
        <a href="/" style="font-size:1.25rem; font-weight:800; color:#7c3aed; text-decoration:none; letter-spacing:0.05em; flex-shrink:0;">MIXXED</a>

        <div style="display:flex; gap:0.5rem; flex-shrink:0;">
            <a href="/" style="color:#888; text-decoration:none; padding:0.4rem 0.75rem; border-radius:6px; font-size:0.875rem; transition:color 0.2s;"
               onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'">Главная</a>
            <a href="/charts" style="color:#888; text-decoration:none; padding:0.4rem 0.75rem; border-radius:6px; font-size:0.875rem;"
               onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'">Чарты</a>
        </div>

        <form action="/search" method="get" style="flex:1; max-width:400px;">
            <input type="text" name="q" placeholder="Поиск миксов, исполнителей..."
                   class="form-input" style="padding:0.5rem 1rem; font-size:0.875rem;"/>
        </form>

        <div style="display:flex; align-items:center; gap:0.75rem; margin-left:auto;">
            <a sec:authorize="isAuthenticated()" href="/upload"
               style="background:#7c3aed; color:white; text-decoration:none; padding:0.5rem 1rem; border-radius:8px; font-size:0.875rem; font-weight:500; white-space:nowrap;">
                + Загрузить
            </a>

            <div sec:authorize="!isAuthenticated()" style="display:flex; gap:0.5rem;">
                <a href="/login" style="color:#888; text-decoration:none; padding:0.5rem 1rem; border-radius:8px; font-size:0.875rem; border:1px solid #2a2a2a;">
                    Войти
                </a>
                <a href="/register" style="background:#7c3aed; color:white; text-decoration:none; padding:0.5rem 1rem; border-radius:8px; font-size:0.875rem;">
                    Регистрация
                </a>
            </div>

            <div sec:authorize="isAuthenticated()" style="display:flex; align-items:center; gap:0.5rem;">
                <a th:if="${currentUser != null}" th:href="'/u/' + ${currentUser.username}"
                   style="display:flex; align-items:center; gap:0.5rem; text-decoration:none; color:#fff;">
                    <img th:if="${currentUser.profilePictureUrl != null}"
                         th:src="@{/s3/{key}(key=${currentUser.profilePictureUrl})}"
                         style="width:32px; height:32px; border-radius:50%; object-fit:cover;" alt="avatar"/>
                    <div th:unless="${currentUser != null and currentUser.profilePictureUrl != null}"
                         style="width:32px; height:32px; border-radius:50%; background:#7c3aed; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.875rem;">
                        <span th:if="${currentUser != null}" th:text="${currentUser.username.substring(0,1).toUpperCase()}"></span>
                    </div>
                    <span th:if="${currentUser != null}" th:text="${currentUser.username}" style="font-size:0.875rem;"></span>
                </a>
                <a href="/settings" style="color:#888; text-decoration:none; font-size:0.875rem; padding:0.25rem 0.5rem;">⚙</a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" style="background:none; border:none; color:#888; cursor:pointer; font-size:0.875rem;">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
