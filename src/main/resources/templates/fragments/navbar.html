<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar(currentUser)" class="navbar">
    <div class="flex items-center gap-6 max-w-[1280px] mx-auto px-6 h-16">

        <a href="/" class="brand">MIXXED</a>

        <div class="flex gap-1 flex-shrink-0">
            <a href="/" class="nav-link">Главная</a>
            <a href="/charts" class="nav-link">Чарты</a>
            <a href="/recommendations" class="nav-link">Для вас</a>
        </div>

        <form action="/search" method="get" class="flex-1 max-w-[400px]">
            <input type="text" name="q" placeholder="Поиск миксов, исполнителей..." class="nav-search"/>
        </form>

        <div class="flex items-center gap-3 ml-auto">

            <a sec:authorize="isAuthenticated()" href="/upload" class="btn-primary text-sm py-2 px-4">
                + Загрузить
            </a>

            <div sec:authorize="!isAuthenticated()" class="flex gap-2">
                <a href="/login" class="btn-secondary text-sm py-2 px-4">Войти</a>
                <a href="/register" class="btn-primary text-sm py-2 px-4">Регистрация</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="flex items-center gap-2">
                <a th:if="${currentUser != null}" th:href="'/u/' + ${currentUser.username}"
                   class="flex items-center gap-2 no-underline text-white">
                    <img th:if="${currentUser.profilePictureUrl != null}"
                         th:src="@{/s3/{key}(key=${currentUser.profilePictureUrl})}"
                         class="w-8 h-8 rounded-full object-cover" alt="avatar"/>
                    <div th:unless="${currentUser != null and currentUser.profilePictureUrl != null}"
                         class="avatar-placeholder w-8 h-8 text-xs">
                        <span th:if="${currentUser != null}" th:text="${currentUser.username.substring(0,1).toUpperCase()}"></span>
                    </div>
                    <span th:if="${currentUser != null}" th:text="${currentUser.username}" class="text-sm hidden sm:inline"></span>
                </a>
                <a href="/settings" class="btn-primary text-sm py-2 px-2">
                    <img th:src="@{/images/icons/settings.svg}" class="w-3 h-3" alt="settings"/>
                </a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="nav-link">Выйти</button>
                </form>
            </div>

        </div>
    </div>
</nav>
</body>
</html>
