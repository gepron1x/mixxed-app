<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="playlistCard(playlist, showAuthor)" class="mix-card" style="background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; overflow:hidden; transition:transform 0.2s, box-shadow 0.2s;" onmouseenter="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 8px 20px rgba(0,0,0,0.4)';" onmouseleave="this.style.transform=''; this.style.boxShadow='';">
    <a th:href="'/playlist/' + ${playlist.slug}" style="text-decoration:none; display:block;">

        <div style="aspect-ratio:1; background:#2a2a2a; overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative;">
            <img th:if="${not #lists.isEmpty(playlist.mixes) and playlist.mixes[0].coverUrl != null}"
                 th:src="'/s3/' + ${playlist.mixes[0].coverUrl}"
                 alt="playlist cover"
                 style="width:100%; height:100%; object-fit:cover;"/>

            <div th:unless="${not #lists.isEmpty(playlist.mixes) and playlist.mixes[0].coverUrl != null}"
                 style="font-size:3rem; user-select:none;">
                💿
            </div>
        </div>

        <div style="padding:1rem;">
            <div th:text="${playlist.title}"
                 style="font-weight:600; color:#fff; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>

            <div th:if="${showAuthor}"
                 th:text="'от ' + ${playlist.author.username}"
                 style="color:#7c3aed; font-size:0.8125rem; margin-top:0.15rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>

            <div th:text="${#lists.size(playlist.mixes)} + ' миксов'"
                 style="color:#888; font-size:0.8125rem; margin-top:0.35rem; display:flex; align-items:center; gap:0.25rem;"></div>
        </div>
    </a>
</div>

</html>
