<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="playlistCard(playlist, showAuthor)" class="mix-card">
    <a th:href="'/playlist/' + ${playlist.slug}" class="block no-underline">

        <div class="aspect-square overflow-hidden flex items-center justify-center" style="background:var(--border-2);">
            <img th:if="${not #lists.isEmpty(playlist.mixes) and playlist.mixes[0].coverUrl != null}"
                 th:src="'/s3/' + ${playlist.mixes[0].coverUrl}"
                 alt="playlist cover"
                 class="w-full h-full object-cover"/>
            <div th:unless="${not #lists.isEmpty(playlist.mixes) and playlist.mixes[0].coverUrl != null}"
                 class="text-5xl select-none">💿</div>
        </div>

        <div class="p-3.5">
            <div th:text="${playlist.title}"
                 class="font-semibold truncate"
                 style="color:var(--text); font-size:1rem;"></div>

            <div th:if="${showAuthor}"
                 th:text="'от ' + ${playlist.author.username}"
                 class="truncate mt-0.5 font-medium"
                 style="color:var(--accent); font-size:0.8125rem;"></div>

            <div th:text="${#lists.size(playlist.mixes)} + ' миксов'"
                 class="mt-1.5"
                 style="color:var(--text-muted); font-size:0.8125rem;"></div>
        </div>
    </a>
</div>

</html>
