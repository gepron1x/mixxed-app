<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MIXXED — Главная</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap">

    <section class="section">
        <div sec:authorize="isAuthenticated()">
            <h1 class="page-heading">
                Привет, <span th:if="${currentUser != null}" th:text="${currentUser.username}" style="color:var(--accent);"></span>!
            </h1>
            <p style="color:var(--text-muted); font-size:1rem;">Твои рекомендации на сегодня</p>
        </div>
        <div sec:authorize="!isAuthenticated()">
            <h1 class="page-heading">
                Добро пожаловать в <span style="color:var(--accent);">MIXXED</span>
            </h1>
            <p style="color:var(--text-muted); font-size:1.125rem;">Лучшие DJ-миксы, собранные для тебя</p>
            <div class="flex gap-3 mt-6">
                <a href="/register" class="btn-primary">Начать слушать</a>
                <a href="/charts" class="btn-secondary">Топ чарты</a>
            </div>
        </div>
    </section>

    <section class="section">
        <h2 class="section-title">
            <span sec:authorize="isAuthenticated()">Для вас</span>
            <span sec:authorize="!isAuthenticated()">Новые миксы</span>
        </h2>
        <div th:if="${recommendations != null and !recommendations.isEmpty()}" class="grid-cards">
            <th:block th:each="mix : ${recommendations}">
                <div th:replace="~{fragments/mix-card :: mixCard(${mix}, true)}"></div>
            </th:block>
        </div>
        <div th:if="${recommendations == null or recommendations.isEmpty()}" class="empty-state">
            Пока нет миксов.
        </div>
    </section>

    <section class="section">
        <h2 class="section-title">Популярное</h2>
        <div th:if="${popular != null and !popular.isEmpty()}" class="grid-cards">
            <th:block th:each="mix : ${popular}">
                <div th:replace="~{fragments/mix-card :: mixCard(${mix}, true)}"></div>
            </th:block>
        </div>
        <div th:if="${popular == null or popular.isEmpty()}" class="empty-state">
            Пока нет миксов.
        </div>
    </section>

    <section class="section">
        <h2 class="section-title">Новые плейлисты</h2>
        <div th:if="${playlists != null and !playlists.isEmpty()}" class="grid-cards">
            <th:block th:each="playlist : ${playlists}">
                <div th:replace="~{fragments/playlist-card :: playlistCard(${playlist}, true)}"></div>
            </th:block>
        </div>
        <div th:if="${playlists == null or playlists.isEmpty()}" class="empty-state">
            Пока нет плейлистов.
        </div>
    </section>

</main>
</body>
</html>
