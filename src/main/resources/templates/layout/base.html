<!DOCTYPE html>
<html lang="ru" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Mixxed'">Mixxed</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex flex-col">

<nav class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-screen-2xl mx-auto px-4 md:px-6 py-4">

        <div class="flex items-center justify-between">

            <div class="flex items-center gap-3">
                <span class="text-2xl font-bold tracking-tighter bg-gradient-to-r block from-purple-500 to-indigo-400 bg-clip-text text-transparent">MIXXED</span>
            </div>

            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a th:href="@{/}" class="nav-link text-white transition-colors">Главная</a>
                <a th:href="@{/likes}" class="nav-link text-zinc-400 hover:text-white transition-colors">Лайки</a>
                <a th:href="@{/my-mixes}" class="nav-link text-zinc-400 hover:text-white transition-colors">Мои миксы</a>
            </div>

            <div class="hidden md:block flex-1 max-w-md mx-10">
                <div class="relative">
                    <input
                            type="text"
                            placeholder="Поиск миксов и диджеев..."
                            class="w-full bg-zinc-800 border border-zinc-700 focus:border-purple-500 focus:outline-none rounded-3xl py-3 px-6 pl-12 text-sm text-zinc-200 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 absolute left-5 top-1/2 -translate-y-1/2 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 01-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>

            <div class="flex items-center gap-4">

                <div th:if="${#authentication?.principal != null}" class="flex items-center gap-4">
                    <a th:href="@{/upload}"
                       class="bg-purple-600 hover:bg-purple-500 transition-colors px-5 py-2.5 rounded-2xl text-sm font-semibold flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        <span class="hidden sm:inline">Загрузить</span>
                    </a>

                    <div class="flex items-center gap-3 cursor-pointer">
                        <div class="w-9 h-9 bg-zinc-700 rounded-2xl overflow-hidden border border-zinc-600">
                            <img th:src="${profilePictureUrl} ?: @{/images/default-avatar.png}"
                                 alt="Avatar" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>

                <div th:if="${#authentication?.principal == null}">
                    <a th:href="@{/login}"
                       class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-6 py-2.5 rounded-2xl text-sm font-medium transition-colors">
                        Войти
                    </a>
                </div>

                <button id="mobile-menu-button"
                        class="md:hidden w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded-2xl transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="md:hidden mt-4">
            <div class="relative">
                <input type="text" placeholder="Поиск..."
                       class="w-full bg-zinc-800 border border-zinc-700 focus:border-purple-500 rounded-3xl py-3 px-6 pl-12 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 absolute left-5 top-1/2 -translate-y-1/2 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 01-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-4 md:px-6 py-10 flex-1 w-full" th:fragment="content">


</main>

<script>
    document.getElementById('mobile-menu-button').addEventListener('click', () => {
        alert('Мобильное меню будет добавлено позже');
    });
</script>
</body>
</html>
