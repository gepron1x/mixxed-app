<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MIXXED — Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg text-white min-h-screen" style="display:flex; align-items:center; justify-content:center;">
<div style="width:100%; max-width:400px; padding:1.5rem;">
    <div style="text-align:center; margin-bottom:2rem;">
        <a href="/" style="font-size:2rem; font-weight:800; color:#7c3aed; text-decoration:none;">MIXXED</a>
        <p style="color:#888; margin-top:0.5rem;">Войдите в аккаунт</p>
    </div>

    <div style="background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:2rem;">
        <div th:if="${error}" style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1.25rem; font-size:0.875rem;"
             th:text="${error}"></div>
        <div th:if="${message}" style="background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3); color:#4ade80; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1.25rem; font-size:0.875rem;"
             th:text="${message}"></div>

        <form th:action="@{/login}" method="post">
            <div style="margin-bottom:1rem;">
                <label style="display:block; font-size:0.875rem; color:#888; margin-bottom:0.5rem;">Имя пользователя</label>
                <input type="text" name="username" class="form-input" placeholder="username" required autofocus/>
            </div>
            <div style="margin-bottom:1.5rem;">
                <label style="display:block; font-size:0.875rem; color:#888; margin-bottom:0.5rem;">Пароль</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required/>
            </div>
            <div style="margin-bottom:1.5rem;">
                <input
                        type="checkbox"
                        id="remember-me"
                        name="remember-me"
                        class="w-4 h-4 accent-[#7c3aed] bg-[#2a2a2a] border border-[#444] rounded
               focus:ring-2 focus:ring-[#7c3aed]/50 cursor-pointer"
                >
                <label
                        for="remember-me"
                        class="text-sm text-gray-400 cursor-pointer"
                >
                    Запомнить меня
                </label>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">Войти</button>
        </form>

        <p style="text-align:center; margin-top:1.5rem; color:#888; font-size:0.875rem;">
            Нет аккаунта? <a href="/register" style="color:#7c3aed; text-decoration:none;">Зарегистрироваться</a>
        </p>
    </div>
</div>
</body>
</html>
