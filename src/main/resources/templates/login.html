<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MIXXED — Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg">
<div class="auth-wrap">
    <div class="w-full" style="max-width:400px;">
        <div class="text-center mb-8">
            <a href="/" class="auth-brand">MIXXED</a>
            <p class="auth-subtitle">Войдите в аккаунт</p>
        </div>

        <div class="p-4 card card-pad-lg">
            <div th:if="${error}" class="alert-error" th:text="${error}"></div>
            <div th:if="${message}" class="alert-success" th:text="${message}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" name="username" class="form-input" placeholder="username" required autofocus/>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required/>
                </div>
                <div class="flex items-center gap-2 mb-6">
                    <input type="checkbox" id="remember-me" name="remember-me"
                           class="w-4 h-4 cursor-pointer rounded"
                           style="accent-color:var(--accent);">
                    <label for="remember-me" class="cursor-pointer" style="font-size:0.875rem; color:var(--text-muted);">
                        Запомнить меня
                    </label>
                </div>
                <button type="submit" class="btn-primary w-full justify-center">Войти</button>
            </form>

            <p class="text-center mt-6" style="color:var(--text-muted); font-size:0.875rem;">
                Нет аккаунта? <a href="/register" style="color:var(--accent); text-decoration:none;">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
