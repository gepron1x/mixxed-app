<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${mix.title} + ' — MIXXED'">Mix — MIXXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap-md">
    <div class="flex gap-8" x-data="audioPlayer(window.mixPlayerInit)" style="flex-wrap:wrap;">

        <!-- Left column -->
        <div style="flex:1; min-width:300px;">

            <!-- Mix header -->
            <div class="flex gap-6 mb-8">
                <div class="flex-shrink-0 rounded-xl overflow-hidden" style="width:180px; height:180px; background:var(--border-2);">
                    <img th:if="${mix.coverUrl != null}" th:src="@{/s3/{key}(key=${mix.coverUrl})}"
                         alt="cover" class="w-full h-full object-cover"/>
                    <div th:unless="${mix.coverUrl != null}"
                         class="w-full h-full flex items-center justify-center text-6xl">🎵</div>
                </div>
                <div class="flex-1 flex flex-col justify-center">
                    <div th:if="${mix.genre != null}" class="genre-badge mb-3" style="width:fit-content;" th:text="${mix.genre}"></div>
                    <h1 style="font-family:'Unbounded',sans-serif; font-size:1.5rem; font-weight:800; margin-bottom:0.4rem; letter-spacing:-0.02em;"
                        th:text="${mix.title}"></h1>
                    <a th:href="'/u/' + ${mix.author.username}"
                       th:text="${mix.author.username}"
                       class="no-underline mb-2"
                       style="color:var(--text-muted); font-size:0.9375rem;"></a>
                    <p th:if="${mix.description != null}" th:text="${mix.description}"
                       style="color:var(--text-muted); font-size:0.875rem; line-height:1.6; margin-bottom:0.75rem;"></p>
                    <div class="flex items-center gap-3 mt-1">
                        <span style="color:var(--text-muted); font-size:0.875rem;"
                              th:text="${mix.totalPlays} + ' прослушиваний'"></span>
                        <button sec:authorize="isAuthenticated()"
                                @click="toggleLike()"
                                class="like-btn"
                                :class="liked ? 'liked' : ''">
                            <span x-text="liked ? '♥' : '♡'"></span>
                            <span x-text="likeCount"></span>
                        </button>
                        <span sec:authorize="!isAuthenticated()" style="color:var(--text-muted); font-size:0.875rem;">
                            <span th:text="${likeCount}"></span> ♥
                        </span>
                    </div>
                </div>
            </div>

            <!-- Audio player -->
            <div class="audio-player mb-8">
                <audio x-ref="audio"
                       th:attr="data-slug=${mix.slug}"
                       preload="none"
                       @timeupdate="onTimeUpdate()"
                       @loadedmetadata="onLoaded()"
                       @ended="playing = false"
                       class="hidden"></audio>

                <div class="flex items-center gap-4 mb-4">
                    <button @click="togglePlay()" class="play-btn">
                        <span x-text="playing ? '⏸' : '▶'"></span>
                    </button>
                    <div class="flex-1">
                        <div class="progress-bar" @click="seek($event)">
                            <div class="progress-fill" :style="'width:' + progress + '%'"></div>
                        </div>
                    </div>
                    <span style="color:var(--text-muted); font-size:0.8125rem; white-space:nowrap; min-width:80px; text-align:right; font-variant-numeric:tabular-nums;"
                          x-text="formatTime(currentTime) + ' / ' + formatTime(duration)">0:00 / 0:00</span>
                </div>

                <div class="flex items-center gap-3">
                    <span style="color:var(--text-muted); font-size:0.875rem;">🔊</span>
                    <input type="range" min="0" max="1" step="0.05" x-model="volume" @input="setVolume()"
                           class="flex-1" style="max-width:120px; accent-color:var(--accent);"/>
                </div>
            </div>

            <!-- Tracklist -->
            <div th:if="${mix.tracks != null and !mix.tracks.isEmpty()}" class="mb-8">
                <h3 class="section-title">Треклист</h3>
                <div class="card overflow-hidden">
                    <div th:each="track, stat : ${mix.tracks}"
                         class="tracklist-item"
                         th:x-bind:class="|activeTrack === ${track.position} ? 'active' : ''|"
                         th:x-on:click="|seekToTime(${track.startTimeSeconds}, ${track.position})|">
                        <span style="color:var(--text-muted); font-size:0.8125rem; min-width:36px;"
                              th:text="${track.position}"></span>
                        <span style="color:var(--text-muted); font-size:0.8125rem; min-width:50px; font-variant-numeric:tabular-nums;"
                              th:text="${track.startTimeSeconds / 60} + ':' + ${#strings.toString(track.startTimeSeconds % 60).length() == 1 ? '0' + track.startTimeSeconds % 60 : track.startTimeSeconds % 60}"></span>
                        <span class="flex-1" style="font-size:0.875rem;">
                            <span th:text="${track.artist}" class="font-medium"></span>
                            <span th:if="${track.title != null and !track.title.isEmpty()}"
                                  style="color:var(--text-muted);"> — <span th:text="${track.title}"></span></span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Add to playlist -->
            <div sec:authorize="isAuthenticated()" th:if="${userPlaylists != null and !userPlaylists.isEmpty()}"
                 class="mb-8" x-data="{open: false}">
                <button @click="open = !open" class="btn-secondary" style="font-size:0.875rem;">
                    + В плейлист
                </button>
                <div x-show="open" class="card mt-3 overflow-hidden" style="max-width:300px;">
                    <div th:each="pl : ${userPlaylists}">
                        <form th:action="'/playlist/' + ${pl.slug} + '/add'" method="post" class="m-0">
                            <input type="hidden" name="mixId" th:value="${mix.id}"/>
                            <button type="submit"
                                    class="w-full text-left px-4 py-3 bg-transparent border-none border-b cursor-pointer text-sm transition-colors"
                                    style="color:var(--text); border-bottom:1px solid var(--border); font-family:'Onest',sans-serif;"
                                    onmouseover="this.style.background='var(--accent-dim)'"
                                    onmouseout="this.style.background='transparent'"
                                    th:text="${pl.title}"></button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Comments -->
            <div x-data="commentsManager(window.comments)" class="mt-8">
                <h3 class="section-title">
                    Комментарии <span style="color:var(--text-muted); font-weight:400; font-family:'Onest',sans-serif; font-size:0.875rem;"
                                      x-text="'(' + comments.length + ')'"></span>
                </h3>

                <form sec:authorize="isAuthenticated()"
                      th:action="'/mix/' + ${mix.slug} + '/comment'"
                      method="post"
                      class="flex gap-3 mb-6"
                      @submit.prevent="addComment($event)">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <input type="text" name="content"
                           x-model="newComment"
                           class="form-input flex-1"
                           placeholder="Написать комментарий..."
                           required/>
                    <button type="submit" class="btn-primary">Отправить</button>
                </form>

                <div x-show="comments.length === 0" class="empty-state">
                    Комментариев пока нет. Будьте первым!
                </div>

                <template x-for="comment in comments" :key="comment.id">
                    <div class="comment-item" :id="'comment-' + comment.id">
                        <img :src="comment.profilePictureUrl ? '/s3/' + comment.profilePictureUrl : null"
                             class="w-9 h-9 rounded-full object-cover flex-shrink-0"
                             alt="avatar"
                             x-show="comment.profilePictureUrl"/>
                        <div x-show="!comment.profilePictureUrl"
                             class="avatar-placeholder flex-shrink-0"
                             style="width:36px; height:36px; font-size:0.875rem;">
                            <span x-text="comment.authorName.substring(0,1).toUpperCase()"></span>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-baseline gap-2 mb-1">
                                <a :href="'/u/' + comment.authorName"
                                   class="font-semibold no-underline"
                                   style="color:var(--text); font-size:0.875rem;"
                                   x-text="comment.authorName"></a>
                                <span style="color:var(--text-muted); font-size:0.75rem;"
                                      x-text="formatDate(comment.createdAt)"></span>
                            </div>
                            <p x-text="comment.content"
                               style="color:var(--text-dim); font-size:0.875rem; margin:0;"></p>
                        </div>
                        <button @click="deleteComment(comment.id)"
                                x-show="comment.canDelete"
                                class="btn-danger"
                                style="color:var(--text-muted); font-size:1.125rem;"
                                title="Удалить комментарий"><img th:src="@{/images/icons/delete.svg}" class="w-4 h-4" alt="image"/></button>
                    </div>
                </template>
            </div>

        </div>

        <!-- Right column -->
        <div style="width:320px; flex-shrink:0;">
            <div class="flex gap-2 mb-4">
                <div th:if="(${mix.author.id} == ${currentUser?.id})" class="flex gap-2 items-center">
                    <a th:href="'/mix/edit/' + ${mix.slug}" class="btn-edit">
                        <span>Редактировать</span>
                    </a>
                    <form th:if="(${currentUser?.isAdmin() == true}) or (${mix.author.id} == ${currentUser?.id})"
                          th:action="'/mix/' + ${mix.slug} + '/delete'" method="post"
                          class="inline"
                          onsubmit="return confirm('Вы действительно хотите удалить этот микс? Это действие нельзя отменить.')">
                        <button type="submit" class="btn-danger">
                            <span>Удалить</span>
                        </button>
                    </form>
                </div>
            </div>

            <p class="mb-3" style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:600;">О миксе</p>
            <div class="info-card">
                <div class="info-field">
                    <div class="info-label">Автор</div>
                    <div class="info-value">
                        <a th:href="'/u/' + ${mix.author.username}"
                           th:text="${mix.author.username}"
                           class="no-underline"
                           style="color:var(--text);"></a>
                    </div>
                </div>
                <div th:if="${mix.genre != null}" class="info-field">
                    <div class="info-label">Жанр</div>
                    <div class="info-value" th:text="${mix.genre}"></div>
                </div>
                <div class="info-field">
                    <div class="info-label">Прослушиваний</div>
                    <div class="info-value" th:text="${mix.totalPlays}"></div>
                </div>
                <div th:if="${mix.uploadedAt != null}" class="info-field">
                    <div class="info-label">Загружен</div>
                    <div class="info-value" th:text="${#temporals.format(mix.uploadedAt, 'dd.MM.yyyy')}"></div>
                </div>
            </div>
        </div>

    </div>
</main>

<script th:src="@{/js/mix/player.js}"></script>
<script th:src="@{/js/mix/comments.js}"></script>
<script th:inline="javascript">
    window.mixPlayerInit = {
        liked: /*[[${liked}]]*/ false,
        likeCount: /*[[${likeCount}]]*/ 0,
        slug: /*[[${mix.slug}]]*/ ''
    };
    window.comments = /*[[${comments}]]*/ []
</script>
</body>
</html>
