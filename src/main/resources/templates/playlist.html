<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${playlist.title} + ' — MIXXED'">Плейлист — MIXXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap-sm"
      x-data="playlistPlayer(window.playlistMixes)"
      x-init="initAudio()">

    <audio x-ref="audio"
           @timeupdate="onTimeUpdate()"
           @loadedmetadata="duration = $el.duration"
           @ended="nextTrack()"></audio>

    <!-- Playlist header -->
    <div class="flex gap-8 items-start mb-10" style="flex-wrap:wrap;">
        <div class="flex-shrink-0 rounded-xl overflow-hidden flex items-center justify-center"
             style="width:180px; height:180px; background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,0.4);">
            <template x-if="mixes.length > 0 && mixes[0].coverUrl">
                <img :src="'/s3/' + mixes[0].coverUrl" alt="playlist cover" class="w-full h-full object-cover"/>
            </template>
            <template x-if="mixes.length === 0 || !mixes[0].coverUrl">
                <span style="font-size:4rem;">💿</span>
            </template>
        </div>

        <div class="flex-1" style="padding-top:0.5rem;">
            <span class="genre-badge mb-3 inline-block">ПЛЕЙЛИСТ</span>
            <h1 th:text="${playlist.title}"
                class="page-heading" style="margin-bottom:0.75rem;"></h1>
            <p th:text="${playlist.description}"
               class="mb-6" style="color:var(--text-muted); font-size:1rem; max-width:600px;"></p>

            <form th:if="(${currentUser?.isAdmin() == true}) or (${playlist.authorUsername} == ${currentUser?.username})"
                  th:action="'/playlist/' + ${playlist.slug} + '/delete'" method="post"
                  class="inline mb-4 block"
                  onsubmit="return confirm('Вы действительно хотите удалить этот плейлист? Это действие нельзя отменить.')">
                <button type="submit" class="btn-danger mb-4">
                    <span>🗑</span>
                    <span>Удалить плейлист</span>
                </button>
            </form>

            <div class="flex items-center gap-4">
                <button @click="playAll()"
                        :disabled="mixes.length === 0"
                        class="btn-play-all">
                    <span>▶</span> Слушать все
                </button>
                <span style="color:var(--text-muted); font-size:0.875rem;"
                      x-text="mixes.length + ' треков'"></span>
            </div>
        </div>
    </div>

    <!-- Now playing bar -->
    <div x-show="currentIndex !== null" x-cloak class="now-playing-bar">
        <div class="flex items-center gap-4">
            <div class="flex-shrink-0 rounded-md overflow-hidden flex items-center justify-center"
                 style="width:50px; height:50px; background:var(--border-2);">
                <template x-if="currentMix && currentMix.coverUrl">
                    <img :src="'/s3/' + currentMix.coverUrl" alt="now playing" class="w-full h-full object-cover"/>
                </template>
                <template x-if="!currentMix || !currentMix.coverUrl">
                    <span class="text-xl">🎵</span>
                </template>
            </div>

            <div class="flex-1 min-w-0">
                <div style="font-size:0.75rem; color:var(--accent); font-weight:700; letter-spacing:0.08em;">СЕЙЧАС ИГРАЕТ</div>
                <div x-text="currentMix ? currentMix.title : ''"
                     class="font-bold truncate" style="color:var(--text); font-size:1rem;"></div>
                <div x-text="currentMix ? currentMix.authorUsername : ''"
                     style="color:var(--text-muted); font-size:0.875rem;"></div>
            </div>

            <div class="flex items-center gap-3">
                <button @click="prevTrack()"
                        class="bg-transparent border-none cursor-pointer text-xl p-1"
                        style="color:var(--text);">⏮</button>
                <button @click="togglePlay()"
                        class="flex items-center justify-center rounded-full border-none cursor-pointer font-bold"
                        style="width:40px; height:40px; background:var(--text); color:var(--bg); font-size:1rem;">
                    <span x-show="!playing">▶</span>
                    <span x-show="playing">⏸</span>
                </button>
                <button @click="nextTrack()"
                        class="bg-transparent border-none cursor-pointer text-xl p-1"
                        style="color:var(--text);">⏭</button>
            </div>
        </div>

        <div class="flex items-center gap-3" style="font-size:0.75rem; color:var(--text-muted); font-variant-numeric:tabular-nums;">
            <span x-text="formatTime(currentTime)">0:00</span>
            <div @click="seek($event)"
                 class="flex-1 rounded cursor-pointer relative"
                 style="height:4px; background:var(--border-2);">
                <div :style="'width: ' + progress + '%'"
                     class="rounded"
                     style="height:100%; background:var(--accent); transition:width 0.1s linear;"></div>
            </div>
            <span x-text="formatTime(duration)">0:00</span>
        </div>
    </div>

    <!-- Track list -->
    <div class="card overflow-hidden">
        <div x-show="mixes.length === 0" class="empty-state" x-cloak>
            Плейлист пуст. <a href="/" style="color:var(--accent); text-decoration:none;">Добавьте миксы на главной!</a>
        </div>
        <template x-for="(mix, index) in mixes" :key="mix.slug">
            <div @click="playAt(index)"
                 class="flex items-center gap-4 px-5 py-3.5 cursor-pointer transition-colors"
                 style="border-bottom:1px solid var(--border);"
                 :style="currentIndex === index ? 'background:var(--accent-dim);' : ''"
                 onmouseover="if(!this.style.background.includes('accent')) this.style.background='rgba(255,255,255,0.03)'"
                 onmouseout="if(!this.style.background.includes('accent')) this.style.background=''">

                <div class="w-7 text-center flex-shrink-0 text-sm font-medium"
                     style="color:var(--text-muted);">
                    <span x-show="currentIndex !== index" x-text="index + 1"></span>
                    <span x-show="currentIndex === index"
                          style="color:var(--accent);"
                          x-text="playing ? '▶' : '⏸'"></span>
                </div>

                <div class="w-11 h-11 rounded-md overflow-hidden flex-shrink-0 flex items-center justify-center"
                     style="background:var(--border-2);">
                    <template x-if="mix.coverUrl">
                        <img :src="'/s3/' + mix.coverUrl" alt="cover" class="w-full h-full object-cover">
                    </template>
                    <template x-if="!mix.coverUrl">
                        <span class="text-xl">🎵</span>
                    </template>
                </div>

                <div class="flex-1 min-w-0">
                    <div x-text="mix.title"
                         class="font-medium truncate"
                         :style="currentIndex === index ? 'color:var(--accent)' : 'color:var(--text)'"></div>
                    <div x-text="mix.authorUsername || 'Неизвестно'"
                         class="text-sm truncate mt-0.5"
                         style="color:var(--text-muted);"></div>
                </div>

                <div class="flex-shrink-0">
                    <template x-if="mix.genre">
                        <span class="genre-badge" x-text="mix.genre"></span>
                    </template>
                </div>

                <div class="flex-shrink-0 text-right text-sm w-20"
                     style="color:var(--text-muted);"
                     x-text="mix.totalPlays + ' ♪'"></div>

                <div class="flex-shrink-0">
                    <a :href="'/mix/' + mix.slug"
                       @click.stop
                       class="px-2 py-1 text-xl no-underline transition-colors"
                       style="color:var(--text-muted);"
                       onmouseover="this.style.color='var(--accent)'"
                       onmouseout="this.style.color='var(--text-muted)'"
                       title="Открыть страницу микса">↗</a>
                </div>
            </div>
        </template>
    </div>
</main>

<script th:inline="javascript">
    window.playlistMixes = /*[[${playlist.mixes}]]*/ [];
</script>
<script th:src="@{/js/playlist.js}"></script>
</body>
</html>
