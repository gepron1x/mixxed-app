<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Редактирование профиля — MIXXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap-form">
    <h1 class="page-heading">Настройки профиля</h1>

    <div class="card card-pad-lg">
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <!-- Avatar section -->
        <div x-data="avatarPreview()" class="mb-8">
            <div class="flex items-center gap-5">
                <div>
                    <template x-if="previewUrl">
                        <img :src="previewUrl"
                             class="rounded-full object-cover"
                             style="width:80px; height:80px; border:2px solid var(--accent);"
                             alt="avatar preview">
                    </template>
                    <template x-if="!previewUrl">
                        <img th:if="${currentUser.profilePictureUrl != null}"
                             th:src="@{/s3/{key}(key=${currentUser.profilePictureUrl})}"
                             class="rounded-full object-cover"
                             style="width:80px; height:80px;"
                             alt="avatar"/>
                        <div th:unless="${currentUser.profilePictureUrl != null}"
                             class="avatar-placeholder"
                             style="width:80px; height:80px; font-size:1.75rem;"
                             th:text="${currentUser.username.substring(0,1).toUpperCase()}"></div>
                    </template>
                </div>
                <div>
                    <div class="font-semibold" th:text="${currentUser.username}"></div>
                    <div style="color:var(--text-muted); font-size:0.875rem;" th:text="${currentUser.email}"></div>
                </div>
            </div>

            <div class="mt-5">
                <input type="file" id="avatarFile" name="avatarFile" accept="image/*"
                       @change="previewFile($event)" class="hidden"/>
                <label for="avatarFile" class="btn-primary cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 4v4m0-4l-4-4m4 4l-4 4" />
                    </svg>
                    Выбрать фото
                </label>
                <p class="mt-1.5" style="color:var(--text-muted); font-size:0.75rem;">JPEG, PNG. Максимум 5 МБ.</p>
                <button type="button"
                        x-show="previewUrl"
                        @click="cancelPreview()"
                        class="mt-3 bg-transparent border-none cursor-pointer p-0 underline"
                        style="color:#f87171; font-size:0.875rem;">
                    Отменить выбор
                </button>
            </div>
        </div>

        <form th:action="@{/settings}" method="post" enctype="multipart/form-data" th:object="${form}">
            <div class="form-group">
                <label class="form-label">О себе</label>
                <textarea th:field="*{bio}" class="form-input" rows="4"
                          placeholder="Расскажите о себе..."></textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="btn-primary">Сохранить</button>
                <a th:href="'/u/' + ${currentUser.username}" class="btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/avatar.js}"></script>
</body>
</html>
