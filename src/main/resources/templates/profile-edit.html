<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Редактирование профиля — MIXXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0f0f0f',
                        card: '#1a1a1a',
                        border: '#2a2a2a',
                        accent: '#7c3aed'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg text-white min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main style="max-width:600px; margin:0 auto; padding:2rem 1.5rem;">
    <h1 style="font-size:1.75rem; font-weight:800; margin-bottom:2rem;">Настройки профиля</h1>

    <div style="background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:2rem;">
        <div th:if="${error}" style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1.25rem; font-size:0.875rem;"
             th:text="${error}"></div>

        <div x-data="avatarPreview()" style="margin-bottom:2rem;">
            <div style="display:flex; align-items:center; gap:1.25rem;">
                <!-- Preview Image -->
                <div>
                    <template x-if="previewUrl">
                        <img :src="previewUrl"
                             style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid #7c3aed;"
                             alt="avatar preview">
                    </template>
                    <template x-if="!previewUrl">
                        <img th:if="${currentUser.profilePictureUrl != null}"
                             th:src="@{/s3/{key}(key=${currentUser.profilePictureUrl})}"
                             style="width:80px; height:80px; border-radius:50%; object-fit:cover;"
                             alt="avatar"/>
                        <div th:unless="${currentUser.profilePictureUrl != null}"
                             style="width:80px; height:80px; border-radius:50%; background:#7c3aed; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:700;"
                             th:text="${currentUser.username.substring(0,1).toUpperCase()}"></div>
                    </template>
                </div>

                <div>
                    <div style="font-weight:600;" th:text="${currentUser.username}"></div>
                    <div style="color:#888; font-size:0.875rem;" th:text="${currentUser.email}"></div>
                </div>
            </div>

            <div style="margin-top:1.5rem;">
                <input type="file"
                       id="avatarFile"
                       name="avatarFile"
                       accept="image/*"
                       @change="previewFile($event)"
                       style="display: none;"/>

                <label for="avatarFile"
                       class="btn-primary cursor-pointer inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 4v4m0-4l-4-4m4 4l-4 4" />
                    </svg>
                    Выбрать фото
                </label>
                <p style="color:#666; font-size:0.75rem; margin-top:0.375rem;">
                    JPEG, PNG. Максимум 5 МБ.
                </p>

                <button
                        type="button"
                        x-show="previewUrl"
                        @click="cancelPreview()"
                        style="margin-top:0.75rem; color:#f87171; font-size:0.875rem; text-decoration:underline;">
                    Отменить выбор
                </button>
            </div>
        </div>

        <form th:action="@{/settings}" method="post" enctype="multipart/form-data" th:object="${form}">
            <div style="margin-bottom:1.25rem;">
                <label style="display:block; font-size:0.875rem; color:#888; margin-bottom:0.5rem;">О себе</label>
                <textarea th:field="*{bio}" class="form-input" rows="4"
                          placeholder="Расскажите о себе..."
                          style="resize:vertical;"></textarea>
            </div>

            <div style="display:flex; gap:0.75rem;">
                <button type="submit" class="btn-primary">Сохранить</button>
                <a th:href="'/u/' + ${currentUser.username}" class="btn-secondary"
                   style="text-decoration:none; display:inline-block;">Отмена</a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/avatar.js}"></script>

</body>
</html>
