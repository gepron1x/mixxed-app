<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MIXXED — Регистрация</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg">
<div class="auth-wrap">
    <div class="w-full" style="max-width:420px;">
        <div class="text-center mb-8">
            <a href="/" class="auth-brand">MIXXED</a>
            <p class="auth-subtitle">Создайте аккаунт</p>
        </div>

        <div class="p-4 card card-pad-lg">
            <div th:if="${error}" class="alert-error" th:text="${error}"></div>

            <form th:action="@{/register}" method="post" th:object="${form}">
                <div class="form-group">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" th:field="*{username}" class="form-input" placeholder="username" required autofocus/>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-input" placeholder="you@example.com" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" th:field="*{password}" class="form-input" placeholder="••••••••" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Подтвердите пароль</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-input" placeholder="••••••••" required/>
                </div>
                <button type="submit" class="btn-primary w-full justify-center mt-2">Зарегистрироваться</button>
            </form>

            <p class="text-center mt-6" style="color:var(--text-muted); font-size:0.875rem;">
                Уже есть аккаунт? <a href="/login" style="color:var(--accent); text-decoration:none;">Войти</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
