<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Поиск — MIXXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap">

    <form action="/search" method="get" class="flex gap-3 mb-8" style="max-width:600px;">
        <input type="text" name="q" th:value="${query}" class="form-input"
               placeholder="Поиск миксов, исполнителей..." autofocus/>
        <button type="submit" class="btn-primary">Найти</button>
    </form>

    <div class="mb-8">
        <h1 class="page-heading" style="margin-bottom:0.4rem;">
            Поиск<span th:if="${query != null and !query.isEmpty()}">:
                «<span th:text="${query}" style="color:var(--accent);"></span>»</span>
        </h1>
        <p th:if="${results != null}" style="color:var(--text-muted); font-size:0.9375rem;"
           th:text="${#lists.size(results.content)} + ' из ' + ${results.totalElements} + ' результатов'"></p>
    </div>

    <div th:if="${results != null and !results.isEmpty()}" class="grid-cards">
        <th:block th:each="mix : ${results.content}">
            <div th:replace="~{fragments/mix-card :: mixCard(${mix}, true)}"></div>
        </th:block>
    </div>

    <div th:if="${results != null and results.isEmpty() and query != null and !query.isEmpty()}"
         class="empty-state" style="padding:4rem 0;">
        <div style="font-size:3rem; margin-bottom:1rem;">🔍</div>
        <p style="font-size:1.125rem;">Ничего не найдено по запросу «<span th:text="${query}"></span>»</p>
        <p style="font-size:0.875rem; margin-top:0.5rem; color:var(--text-muted);">Попробуйте другие ключевые слова</p>
    </div>

    <div th:if="${query == null or query.isEmpty()}" class="empty-state" style="padding:4rem 0;">
        <div style="font-size:3rem; margin-bottom:1rem;">🎵</div>
        <p style="font-size:1.125rem;">Введите запрос для поиска</p>
    </div>

    <!-- Pagination -->
    <div th:if="${results != null and results.totalPages > 1}"
         class="flex justify-center items-center gap-2 flex-wrap mt-12">

        <a th:if="${results.hasPrevious()}"
           th:href="@{/search(q=${query},page=${results.number - 1},size=${results.size},sortBy=${param.sortBy ?: 'title'},direction=${param.direction ?: 'asc'})}"
           class="btn-secondary px-5 py-2.5 rounded-xl">← Назад</a>
        <span th:if="${!results.hasPrevious()}"
              class="px-5 py-2.5 rounded-xl"
              style="color:var(--text-muted); cursor:not-allowed;">← Назад</span>

        <div th:each="pageNum : ${#numbers.sequence(0, results.totalPages - 1)}"
             th:if="${(pageNum == 0) or (pageNum == results.totalPages - 1) or (pageNum >= results.number - 2 and pageNum <= results.number + 2)}">
            <a th:if="${pageNum != results.number}"
               th:href="@{/search(q=${query},page=${pageNum},size=${results.size},sortBy=${param.sortBy ?: 'title'},direction=${param.direction ?: 'asc'})}"
               class="btn-secondary px-4 py-2.5 rounded-xl"
               th:text="${pageNum + 1}"></a>
            <span th:if="${pageNum == results.number}"
                  class="btn-primary px-4 py-2.5 rounded-xl"
                  th:text="${pageNum + 1}"></span>
        </div>

        <a th:if="${results.hasNext()}"
           th:href="@{/search(q=${query},page=${results.number + 1},size=${results.size},sortBy=${param.sortBy ?: 'title'},direction=${param.direction ?: 'asc'})}"
           class="btn-secondary px-5 py-2.5 rounded-xl">Вперёд →</a>
        <span th:if="${!results.hasNext()}"
              class="px-5 py-2.5 rounded-xl"
              style="color:var(--text-muted); cursor:not-allowed;">Вперёд →</span>
    </div>

</main>
</body>
</html>
