<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Поиск — MIXXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap"
      x-data="{
        tab: 'mixes',
        hasMixes: hasMixes,
        hasUsers: hasUsers,
        hasPlaylists: hasPlaylists
      }"
      x-init="
        if (!hasMixes && hasUsers) tab = 'users';
        else if (!hasMixes && !hasUsers && hasPlaylists) tab = 'playlists';
      ">

    <!-- Search form -->
    <form action="/search" method="get" class="flex gap-3 mb-8" style="max-width:640px;">
        <input type="text" name="q" th:value="${query}" class="form-input"
               placeholder="Поиск миксов, пользователей, плейлистов..." autofocus/>
        <button type="submit" class="btn-primary">Найти</button>
    </form>

    <!-- Title + total -->
    <div class="mb-6">
        <h1 class="page-heading" style="margin-bottom:0.25rem;">
            Поиск
            <span th:if="${query != null and !query.isEmpty()}">:
                «<span th:text="${query}" style="color:var(--accent);"></span>»
            </span>
        </h1>
    </div>

    <!-- Empty / prompt state -->
    <div th:if="${query == null or query.isEmpty()}" class="empty-state" style="padding:4rem 0;">
        <div style="font-size:3rem; margin-bottom:1rem;">🎵</div>
        <p style="font-size:1.125rem;">Введите запрос для поиска</p>
    </div>

    <!-- Results -->
    <div th:if="${query != null and !query.isEmpty()}">

        <!-- Tabs -->
        <div class="flex gap-1 mb-6" style="border-bottom:1px solid var(--border);">
            <button class="search-tab" :class="tab === 'mixes' ? 'active' : ''" @click="tab = 'mixes'">
                Миксы
                <span th:if="${totalMixes != null}"
                      th:text="'(' + ${totalMixes} + ')'"
                      style="font-size:0.75rem; opacity:0.7;"></span>
            </button>
            <button class="search-tab" :class="tab === 'users' ? 'active' : ''" @click="tab = 'users'">
                Пользователи
                <span th:if="${totalUsers != null}"
                      th:text="'(' + ${totalUsers} + ')'"
                      style="font-size:0.75rem; opacity:0.7;"></span>
            </button>
            <button class="search-tab" :class="tab === 'playlists' ? 'active' : ''" @click="tab = 'playlists'">
                Плейлисты
                <span th:if="${totalPlaylists != null}"
                      th:text="'(' + ${totalPlaylists} + ')'"
                      style="font-size:0.75rem; opacity:0.7;"></span>
            </button>
        </div>

        <div x-show="tab === 'mixes'">
            <div th:if="${mixResults != null and mixResults.totalElements > 0}" class="grid-cards">
                <th:block th:each="mix : ${mixResults.content}">
                    <div th:replace="~{fragments/mix-card :: mixCard(${mix}, true)}"></div>
                </th:block>
            </div>

            <div th:if="${mixResults == null or mixResults.totalElements == 0}" class="empty-state" style="padding:3rem 0;">
                <div style="font-size:2.5rem; margin-bottom:0.75rem;">🔍</div>
                <p>Миксов не найдено</p>
                <p style="font-size:0.875rem; margin-top:0.5rem; color:var(--text-muted);">Попробуйте другие ключевые слова</p>
            </div>

            <div th:if="${mixResults != null and mixResults.totalPages > 1}"
                 class="flex justify-center items-center gap-2 flex-wrap mt-10">

                <a th:if="${mixResults.hasPrevious()}"
                   th:href="@{/search(q=${query},page=${mixResults.number - 1},size=${mixResults.size},sortBy=${param.sortBy ?: 'title'},direction=${param.direction ?: 'asc'})}"
                   class="btn-secondary px-5 py-2.5 rounded-xl">← Назад</a>
                <span th:if="${!mixResults.hasPrevious()}"
                      class="px-5 py-2.5 rounded-xl" style="color:var(--text-muted); cursor:not-allowed;">← Назад</span>

                <div th:each="pageNum : ${#numbers.sequence(0, mixResults.totalPages - 1)}"
                     th:if="${(pageNum == 0) or (pageNum == mixResults.totalPages - 1) or (pageNum >= mixResults.number - 2 and pageNum <= mixResults.number + 2)}">
                    <a th:if="${pageNum != mixResults.number}"
                       th:href="@{/search(q=${query},page=${pageNum},size=${mixResults.size},sortBy=${param.sortBy ?: 'title'},direction=${param.direction ?: 'asc'})}"
                       class="btn-secondary px-4 py-2.5 rounded-xl"
                       th:text="${pageNum + 1}"></a>
                    <span th:if="${pageNum == mixResults.number}"
                          class="btn-primary px-4 py-2.5 rounded-xl"
                          th:text="${pageNum + 1}"></span>
                </div>

                <a th:if="${mixResults.hasNext()}"
                   th:href="@{/search(q=${query},page=${mixResults.number + 1},size=${mixResults.size},sortBy=${param.sortBy ?: 'title'},direction=${param.direction ?: 'asc'})}"
                   class="btn-secondary px-5 py-2.5 rounded-xl">Вперёд →</a>
                <span th:if="${!mixResults.hasNext()}"
                      class="px-5 py-2.5 rounded-xl" style="color:var(--text-muted); cursor:not-allowed;">Вперёд →</span>
            </div>
        </div>

        <div x-show="tab === 'users'" style="display:none;">

            <div th:if="${userResults != null and !userResults.isEmpty()}"
                 style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem;">

                <th:block th:each="user : ${userResults}">
                    <a th:href="'/u/' + ${user.username}"
                       style="background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 1.25rem; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; transition: all 0.2s ease; position: relative; overflow: hidden;"
                       onmouseenter="this.style.transform='translateY(-4px)'; this.style.borderColor='#7c3aed'; this.style.boxShadow='0 8px 24px rgba(124,58,237,0.15)'"
                       onmouseleave="this.style.transform='none'; this.style.borderColor='#2a2a2a'; this.style.boxShadow='none'">

                        <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: #262626; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; border: 2px solid #2a2a2a; transition: border-color 0.2s;">
                            <img th:if="${user.profilePictureUrl != null and !user.profilePictureUrl.isEmpty()}"
                                 th:src="'/s3/' + ${user.profilePictureUrl}"
                                 alt="User avatar"
                                 style="width: 100%; height: 100%; object-fit: cover;"/>
                            <span th:unless="${user.profilePictureUrl != null and !user.profilePictureUrl.isEmpty()}"
                                  th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 1))}"
                                  style="font-size: 1.75rem; font-weight: 700; color: #a78bfa;">U</span>
                        </div>

                        <h3 th:text="${user.username}"
                            style="color: #fff; font-size: 1.125rem; font-weight: 700; margin: 0 0 0.375rem 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            Username
                        </h3>

                        <p th:text="${user.bio != null and !user.bio.isEmpty()} ? ${user.bio} : 'Слушатель'"
                           style="color: #888; font-size: 0.8125rem; margin: 0 0 1.25rem 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.2rem; line-height: 1.4;">
                            Bio
                        </p>

                        <div style="margin-top: auto; width: 100%; background: #222; color: #fff; font-size: 0.8125rem; font-weight: 600; padding: 0.5rem 0; border-radius: 10px; transition: all 0.2s;"
                             onmouseenter="this.style.background='#7c3aed'"
                             onmouseleave="this.style.background='#222'">
                            Профиль
                        </div>

                    </a>
                </th:block>
            </div>

            <div th:if="${userResults == null or userResults.isEmpty()}" class="empty-state" style="padding:4rem 0; text-align:center; color:#888;">
                <div style="font-size:2.5rem; margin-bottom:0.75rem;">👤</div>
                <p style="font-size: 1.05rem;">Пользователей не найдено</p>
            </div>
        </div>

        <div x-show="tab === 'playlists'" style="display:none;">
            <div th:if="${playlistResults != null and !playlistResults.isEmpty()}" class="grid-cards">
                <th:block th:each="playlist : ${playlistResults}">
                    <div th:replace="~{fragments/playlist-card :: playlistCard(${playlist}, true)}"></div>
                </th:block>
            </div>

            <div th:if="${playlistResults == null or playlistResults.isEmpty()}" class="empty-state" style="padding:3rem 0;">
                <div style="font-size:2.5rem; margin-bottom:0.75rem;">📋</div>
                <p>Плейлистов не найдено</p>
            </div>
        </div>

    </div>

</main>
<script th:inline="javascript">
    const hasMixes =  /*[[${mixResults != null and mixResults.totalElements > 0}]]*/ false
    const hasUsers = /*[[${userResults != null and !userResults.isEmpty()}]]*/ false
    const hasPlaylists = /*[[${playlistResults != null and !playlistResults.isEmpty()}]]*/ false
</script>
</body>
</html>
