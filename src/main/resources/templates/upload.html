<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${isEdit} ? 'Редактировать микс — MIXXED' : 'Загрузить микс — MIXXED'"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap-xs"
      x-data="uploadForm(window.existingTracks, window.initialCover)">

    <h1 class="page-heading"
        th:text="${isEdit} ? 'Редактировать микс' : 'Загрузить микс'"></h1>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="${isEdit} ? @{/mix/edit/{id}(id=${mixSlug})} : @{/upload}"
          method="post" enctype="multipart/form-data" @submit="submitting = true">

        <div class="grid grid-cols-2 gap-6 mb-8" style="grid-template-columns:1fr 1fr;">

            <!-- Left: files -->
            <div class="flex flex-col gap-5">

                <div>
                    <label class="form-label">Аудиофайл</label>
                    <label for="audioFile" class="dropzone">
                        <div style="font-size:2.5rem; margin-bottom:0.75rem;">🎵</div>
                        <div class="font-medium mb-1" x-text="audioName || 'Выберите или перетащите файл'"></div>
                        <div style="color:var(--text-muted); font-size:0.8125rem;">MP3, WAV, FLAC — до 500 МБ</div>
                    </label>
                    <input type="file" id="audioFile" name="audioFile" accept="audio/*" class="hidden"
                           th:required="${isEdit == null or !isEdit}"
                           @change="audioName = $event.target.files[0]?.name ?? ''"/>
                </div>

                <div>
                    <label class="form-label">Обложка</label>
                    <label for="coverFile"
                           class="block cursor-pointer rounded-xl overflow-hidden relative"
                           style="width:180px; aspect-ratio:1/1; border:1px dashed var(--border-2); background:var(--bg); transition:border-color 0.2s;"
                           onmouseover="this.style.borderColor='var(--accent)'"
                           onmouseout="this.style.borderColor='var(--border-2)'">
                        <img x-show="coverPreview" :src="coverPreview"
                             class="w-full h-full object-cover rounded-lg"
                             alt="cover preview" x-cloak>
                        <div x-show="!coverPreview"
                             class="w-full h-full flex flex-col items-center justify-center"
                             style="color:var(--text-muted);">
                            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🖼</div>
                            <div class="text-center" style="font-size:0.8125rem;">
                                JPEG, PNG<br>
                                <span style="font-size:0.75rem;">Кликните для выбора</span>
                            </div>
                        </div>
                    </label>
                    <input type="file" id="coverFile" name="coverFile" accept="image/*" class="hidden"
                           @change="previewCover($event)"/>
                </div>
            </div>

            <!-- Right: metadata -->
            <div class="flex flex-col gap-5">
                <div class="form-group">
                    <label class="form-label">Название *</label>
                    <input type="text" name="title" class="form-input" placeholder="Название микса" required
                           th:value="${form.title}"/>
                </div>

                <div class="form-group">
                    <label class="form-label">Жанр</label>
                    <select name="genre" th:value="${form.genre}" class="form-input">
                        <option value="">— Выберите жанр —</option>
                        <th:block th:each="genre : ${genres}">
                            <option th:value="${genre.fullName}" th:text="${genre.fullName}"
                                    th:selected="${form.genre == genre.fullName}"></option>
                        </th:block>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea name="description" class="form-input" rows="4"
                              placeholder="Расскажите о миксе..."
                              th:text="${form.description}"></textarea>
                </div>
            </div>
        </div>

        <!-- Tracklist -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="section-title" style="margin-bottom:0;">Треклист</h3>
                <div class="flex gap-3">
                    <button type="button" @click="addTrack()"
                            class="btn-secondary text-sm py-2 px-4">
                        + Добавить вручную
                    </button>
                    <label class="cursor-pointer">
                        <input type="file" id="cueFile" accept=".cue" class="hidden" @change="parseCueFile($event)"/>
                        <span class="btn-secondary text-sm py-2 px-4">📄 Загрузить .cue</span>
                    </label>
                </div>
            </div>

            <div class="card overflow-hidden">
                <div class="grid text-xs font-bold px-4 py-2.5"
                     style="grid-template-columns:40px 80px 1fr 1fr 36px; gap:0.75rem; background:var(--bg); color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em;">
                    <span>#</span>
                    <span>Время</span>
                    <span>Исполнитель</span>
                    <span>Название</span>
                    <span></span>
                </div>

                <template x-for="(track, idx) in tracks" :key="idx">
                    <div class="grid px-4 py-2.5 items-center"
                         style="grid-template-columns:40px 80px 1fr 1fr 36px; gap:0.75rem; border-top:1px solid var(--border);">
                        <span x-text="idx + 1" style="color:var(--text-muted); font-size:0.875rem;"></span>
                        <input :name="'tracks[' + idx + '].startTime'" x-model="track.startTime"
                               class="tracklist-input" placeholder="00:00"/>
                        <input :name="'tracks[' + idx + '].artist'" x-model="track.artist"
                               class="tracklist-input" placeholder="Исполнитель"/>
                        <input :name="'tracks[' + idx + '].title'" x-model="track.title"
                               class="tracklist-input" placeholder="Название трека"/>
                        <button type="button" @click="removeTrack(idx)"
                                class="bg-transparent border-none cursor-pointer leading-none p-0 text-lg"
                                style="color:var(--text-muted);"
                                title="Удалить">×</button>
                    </div>
                </template>

                <div x-show="tracks.length === 0" class="empty-state">
                    Треклист пуст.<br>
                    <span class="text-sm">Добавьте треки вручную или загрузите .cue файл</span>
                </div>
            </div>
        </div>

        <div class="flex gap-3 items-center">
            <button type="submit" class="btn-primary" :disabled="submitting">
                <span>Сохранить</span>
            </button>
            <a href="/" class="btn-secondary">Отмена</a>
            <span x-show="submitting" style="color:var(--text-muted); font-size:0.875rem;">Обработка, подождите...</span>
        </div>
    </form>
</main>

<script th:inline="javascript">
    window.existingTracks = /*[[${existingTracks}]]*/ []
    window.initialCover = /*[[${coverUrl}]]*/ null
    window.existingTracks = window.existingTracks === null ? [] : window.existingTracks
</script>
<script th:src="@{/js/upload.js}"></script>
</body>
</html>
