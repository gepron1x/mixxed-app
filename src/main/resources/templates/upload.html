<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${isEdit} ? 'Редактировать микс — MIXXED' : 'Загрузить микс — MIXXED'"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#0f0f0f', card: '#1a1a1a', border: '#2a2a2a', accent: '#7c3aed' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg text-white min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main style="max-width:760px; margin:0 auto; padding:2rem 1.5rem;"
      x-data="uploadForm(window.existingTracks, window.initialCover)">

    <h1 style="font-size:1.75rem; font-weight:800; margin-bottom:2rem;"
        th:text="${isEdit} ? 'Редактировать микс' : 'Загрузить микс'"></h1>

    <div th:if="${error}" style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1.5rem; font-size:0.875rem;"
         th:text="${error}"></div>

    <form th:action="${isEdit} ? @{/mix/edit/{id}(id=${mixSlug})} : @{/upload}" method="post" enctype="multipart/form-data" @submit="submitting = true">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">

            <div style="display:flex; flex-direction:column; gap:1.25rem;">

                <div>
                    <label style="display:block; font-size:0.875rem; color:#888; margin-bottom:0.5rem;">Аудиофайл</label>
                    <label for="audioFile"
                           style="display:flex; flex-direction:column; align-items:center; justify-content:center; border:2px dashed #2a2a2a; border-radius:12px; padding:2.5rem 1rem; cursor:pointer; transition:border-color 0.2s; text-align:center;"
                           onmouseover="this.style.borderColor='#7c3aed'" onmouseout="this.style.borderColor='#2a2a2a'">
                        <div style="font-size:2.5rem; margin-bottom:0.75rem;">🎵</div>
                        <div style="font-weight:500; margin-bottom:0.25rem;" x-text="audioName || 'Выберите или перетащите файл'"></div>
                        <div style="color:#888; font-size:0.8125rem;">MP3, WAV, FLAC — до 500 МБ</div>
                    </label>

                    <input type="file" id="audioFile" name="audioFile" accept="audio/*" style="display:none;"
                           th:required="${isEdit == null or !isEdit}"
                           @change="audioName = $event.target.files[0]?.name ?? ''"/>
                </div>

                <div>
                    <label style="display:block; font-size:0.875rem; color:#888; margin-bottom:0.5rem;">Обложка</label>

                    <label for="coverFile"
                           style="display:block; width:180px; aspect-ratio:1/1; border:2px dashed #2a2a2a; border-radius:12px; cursor:pointer; transition:border-color 0.2s; overflow:hidden; position:relative; background:#0f0f0f;">

                        <img x-show="coverPreview"
                             :src="coverPreview"
                             style="width:100%; height:100%; object-fit:cover; border-radius:8px;"
                             alt="cover preview"
                             x-cloak>

                        <div x-show="!coverPreview"
                             style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#888;">
                            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🖼</div>
                            <div style="font-size:0.8125rem; text-align:center;">
                                JPEG, PNG<br>
                                <span style="font-size:0.75rem;">Кликните для выбора</span>
                            </div>
                        </div>
                    </label>

                    <input type="file" id="coverFile" name="coverFile" accept="image/*" style="display:none;"
                           @change="previewCover($event)"/>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:1.25rem;">
                <div>
                    <label style="display:block; font-size:0.875rem; color:#888; margin-bottom:0.5rem;">Название *</label>
                    <input type="text" name="title" class="form-input" placeholder="Название микса" required
                           th:value="${form.title}"/>
                </div>

                <div>
                    <label style="display:block; font-size:0.875rem; color:#888; margin-bottom:0.5rem;">Жанр</label>
                    <select name="genre" th:value="${form.genre}"
                            style="background:#1a1a1a; border:1px solid #2a2a2a; color:#fff; border-radius:8px; padding:0.625rem 1rem; width:100%; outline:none; font-size:0.9375rem;">
                        <option value="">— Выберите жанр —</option>
                        <th:block th:each="genre : ${genres}">
                            <option th:value="${genre.fullName}" th:text="${genre.fullName}" th:selected="${form.genre == genre.fullName}"></option>
                        </th:block>
                    </select>
                </div>

                <div>
                    <label style="display:block; font-size:0.875rem; color:#888; margin-bottom:0.5rem;">Описание</label>
                    <textarea name="description" class="form-input" rows="4" placeholder="Расскажите о миксе..."
                              style="resize:vertical;" th:text="${form.description}"></textarea>
                </div>
            </div>
        </div>

        <div style="margin-top:2rem;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
                <h3 style="font-size:1.125rem; font-weight:700;">Треклист</h3>
                <div style="display:flex; gap:0.75rem;">
                    <button type="button" @click="addTrack()"
                            class="px-4 py-2 text-sm border border-accent text-accent rounded-xl hover:bg-accent/10">
                        + Добавить вручную
                    </button>
                    <label class="cursor-pointer">
                        <input type="file" id="cueFile" accept=".cue" style="display:none;" @change="parseCueFile($event)"/>
                        <span class="px-4 py-2 text-sm border border-[#555] hover:border-gray-400 rounded-xl flex items-center gap-2">
                            📄 Загрузить .cue
                        </span>
                    </label>
                </div>
            </div>

            <div style="background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; overflow:hidden;">
                <!-- Header row -->
                <div style="display:grid; grid-template-columns:40px 80px 1fr 1fr 36px; gap:0.75rem; padding:0.625rem 1rem; background:#0f0f0f; color:#888; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em;">
                    <span>#</span>
                    <span>Время</span>
                    <span>Исполнитель</span>
                    <span>Название</span>
                    <span></span>
                </div>

                <!-- Track rows -->
                <template x-for="(track, idx) in tracks" :key="idx">
                    <div style="display:grid; grid-template-columns:40px 80px 1fr 1fr 36px; gap:0.75rem; padding:0.625rem 1rem; border-top:1px solid #2a2a2a; align-items:center;">
                        <span x-text="idx + 1" style="color:#888; font-size:0.875rem;"></span>
                        <input :name="'tracks[' + idx + '].startTime'" x-model="track.startTime"
                               style="background:#0f0f0f; border:1px solid #2a2a2a; color:#fff; border-radius:6px; padding:0.375rem 0.5rem; font-size:0.875rem; width:100%; outline:none;"
                               placeholder="00:00"/>
                        <input :name="'tracks[' + idx + '].artist'" x-model="track.artist"
                               style="background:#0f0f0f; border:1px solid #2a2a2a; color:#fff; border-radius:6px; padding:0.375rem 0.5rem; font-size:0.875rem; width:100%; outline:none;"
                               placeholder="Исполнитель"/>
                        <input :name="'tracks[' + idx + '].title'" x-model="track.title"
                               style="background:#0f0f0f; border:1px solid #2a2a2a; color:#fff; border-radius:6px; padding:0.375rem 0.5rem; font-size:0.875rem; width:100%; outline:none;"
                               placeholder="Название трека"/>
                        <button type="button" @click="removeTrack(idx)"
                                style="background:none; border:none; color:#888; cursor:pointer; font-size:1.125rem; padding:0; line-height:1;"
                                title="Удалить">×</button>
                    </div>
                </template>

                <div x-show="tracks.length === 0" style="padding:2rem; text-align:center; color:#888;">
                    Треклист пуст.<br>
                    <span class="text-sm">Добавьте треки вручную или загрузите .cue файл</span>
                </div>
            </div>
        </div>

        <!-- Submit -->
        <div style="margin-top:2rem; display:flex; gap:0.875rem; align-items:center;">
            <button type="submit" class="btn-primary" :disabled="submitting"
                    :style="submitting ? 'opacity:0.6; cursor:not-allowed;' : ''">
                <span>Cохранить</span>
            </button>
            <a href="/" class="btn-secondary" style="text-decoration:none; display:inline-block;">Отмена</a>
            <span x-show="submitting" style="color:#888; font-size:0.875rem;">Обработка, подождите...</span>
        </div>
    </form>
</main>

<script th:inline="javascript">
    window.existingTracks = /*[[${existingTracks}]]*/ []
    window.initialCover = /*[[${coverUrl}]]*/ null
</script>
<script th:src="@{/js/upload.js}"></script>
</body>
</html>
