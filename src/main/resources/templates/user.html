<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${profileUser.username} + ' — MIXXED'">Профиль — MIXXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#080808', card: '#0f0f0f', border: '#1c1c1c', accent: '#f59e0b' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-bg min-h-screen">

<div th:replace="~{fragments/navbar :: navbar(${currentUser})}"></div>

<main class="page-wrap-md">

    <!-- Profile header -->
    <div class="flex items-start gap-8 mb-12">
        <div class="flex-shrink-0">
            <img th:if="${profileUser.profilePictureUrl != null}"
                 th:src="@{/s3/{key}(key=${profileUser.profilePictureUrl})}"
                 class="rounded-full object-cover"
                 style="width:96px; height:96px;"
                 alt="avatar"/>
            <div th:unless="${profileUser.profilePictureUrl != null}"
                 class="avatar-placeholder"
                 style="width:96px; height:96px; font-size:2.25rem;"
                 th:text="${profileUser.username.substring(0,1).toUpperCase()}"></div>
        </div>

        <div class="flex-1">
            <h1 style="font-family:'Unbounded',sans-serif; font-size:1.6rem; font-weight:800; margin-bottom:0.25rem; letter-spacing:-0.02em;"
                th:text="${profileUser.username}"></h1>
            <span th:if="${profileUser.admin}" class="genre-badge">Админ</span>
            <p th:if="${profileUser.bio != null and !profileUser.bio.isEmpty()}"
               th:text="${profileUser.bio}"
               class="mb-3"
               style="color:var(--text-muted); font-size:0.9375rem; line-height:1.6;"></p>
            <div class="flex gap-6 mb-4" style="font-size:0.875rem; color:var(--text-muted);">
                <span><strong style="color:var(--text);" th:text="${followersCount}"></strong> подписчиков</span>
                <span><strong style="color:var(--text);" th:text="${followingCount}"></strong> подписок</span>
                <span><strong style="color:var(--text);" th:text="${#lists.size(mixes)}"></strong> миксов</span>
            </div>
            <div class="flex gap-3">
                <form th:if="${!isOwn and currentUser != null}"
                      th:action="'/u/' + ${profileUser.username} + '/follow'" method="post">
                    <button type="submit"
                            th:class="${isFollowing} ? 'btn-secondary' : 'btn-primary'"
                            th:text="${isFollowing ? 'Отписаться' : 'Подписаться'}"></button>
                </form>
                <a th:if="${isOwn}" href="/settings" class="btn-secondary">Редактировать</a>
                <a th:if="${!isOwn and currentUser == null}" href="/login" class="btn-primary">Подписаться</a>
                <a th:href="'/u/' + ${profileUser.username} + '/statistics'" class="btn-secondary">Статистика</a>
                <form th:if="${!isOwn and currentUser?.isAdmin() == true}"
                      th:action="'/u/' + ${profileUser.username} + '/delete'" method="post"
                      x-data
                      @submit.prevent="showConfirm('Вы действительно хотите удалить этот аккаунт? Это действие нельзя отменить.', 'Удалить аккаунт')
                          .then(ok => ok && $el.submit())">
                    <button type="submit" class="btn-danger">
                        <span>Удалить</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div x-data="{tab: 'mixes'}">
        <div class="flex gap-2 mb-6" style="border-bottom:1px solid var(--border); padding-bottom:1rem;">
            <button class="tab-btn" :class="tab === 'mixes' ? 'active' : ''" @click="tab = 'mixes'">
                Все миксы (<span th:text="${#lists.size(mixes)}"></span>)
            </button>
            <button class="tab-btn" :class="tab === 'likes' ? 'active' : ''" @click="tab = 'likes'">
                Понравилось (<span th:text="${#lists.size(likedMixes)}"></span>)
            </button>
            <button class="tab-btn" :class="tab === 'playlists' ? 'active' : ''" @click="tab = 'playlists'">
                Плейлисты (<span th:text="${#lists.size(playlists)}"></span>)
            </button>
        </div>

        <!-- Mixes tab -->
        <div x-show="tab === 'mixes'">
            <div th:if="${!mixes.isEmpty()}" class="grid-cards-sm">
                <th:block th:each="mix : ${mixes}">
                    <div th:replace="~{fragments/mix-card :: mixCard(${mix}, false)}"></div>
                </th:block>
            </div>
            <div th:if="${mixes.isEmpty()}" class="empty-state">Миксов пока нет.</div>
        </div>

        <!-- Likes tab -->
        <div x-show="tab === 'likes'" style="display:none;">
            <div th:if="${!likedMixes.isEmpty()}" class="grid-cards-sm">
                <th:block th:each="mix : ${likedMixes}">
                    <div th:replace="~{fragments/mix-card :: mixCard(${mix}, false)}"></div>
                </th:block>
            </div>
            <div th:if="${likedMixes.isEmpty()}" class="empty-state">Нет понравившихся миксов.</div>
        </div>

        <!-- Playlists tab -->
        <div x-show="tab === 'playlists'" style="display:none;">
            <div th:if="${isOwn}" class="mb-6" x-data="{creating: false}">
                <button @click="creating = !creating" class="btn-primary">+ Новый плейлист</button>
                <form x-show="creating" th:action="@{/playlist/create}" method="post"
                      class="mt-4 card p-5" style="max-width:400px;">
                    <div class="form-group">
                        <label class="form-label">Название</label>
                        <input type="text" name="title" class="form-input" required placeholder="Мой плейлист"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Описание</label>
                        <input type="text" name="description" class="form-input" placeholder="Необязательно"/>
                    </div>
                    <button type="submit" class="btn-primary">Создать</button>
                </form>
            </div>
            <div th:if="${!playlists.isEmpty()}" class="grid-cards-sm">
                <th:block th:each="playlist : ${playlists}">
                    <div th:replace="~{fragments/playlist-card :: playlistCard(${playlist}, false)}"></div>
                </th:block>
            </div>
            <div th:if="${playlists.isEmpty()}" class="empty-state">Плейлистов пока нет.</div>
        </div>
    </div>
</main>
<script th:src="@{/js/modal.js}" defer></script>
</body>
</html>
